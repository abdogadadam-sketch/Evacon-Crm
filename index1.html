    /* EstateFlow dark-mode palette and icon button */

    html[data-theme="dark"] .link-button{color:#9ab8ff}

    html[data-theme="dark"] .detail-block{background:#1d2e47}
    html[data-theme="dark"] .barbg{background:#344661}
    html[data-theme="dark"] .stat .badge-icon{background:#24395c}
    html[data-theme="dark"] .hint{background:#1a2c47;border-color:#314969;color:#c1d6ff}
    html[data-theme="dark"] .login-error{background:#422536;color:#ffb9c4}

function connection() {
  // Always use the published configuration, never browser-saved connection details.
  const c = window.ESTATEFLOW_CONFIG || {};
  return {
    url: String(c.url || '').trim().replace(/\/$/, ''),
    key: String(c.publishableKey || '').trim()
  };
}
function initClient() {
  config = connection();
  const validUrl = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(config.url);
  const validKey = /^(sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_.-]+)$/.test(config.key)

    $('connectionHint').innerHTML = '<div class="login-error">تعذر الاتصال بـ Supabase. تأكد من وضع Project URL وPublishable Key الحقيقيين داخل ملف index.html في GitHub. لا تحتاج لإعداد الاتصال من داخل المتصفح.</div>';
    return false;
  }
  try {
    client = window.supabase.createClient(config.url, config.key, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    $('connectionHint').innerHTML = '';
    return true;
  } catch (e) {
    $('connectionHint').innerHTML = '<div class="login-error">' + E(e.message) + '</div>';
    return false;
  }
}

function friendly(e){if(!e)return 'حدث خطأ غير متوقع';const code=e.code||'';if(code==='23505')return 'الرقم أو كود العقار مسجّل بالفعل؛ لا يمكن إضافته مرتين.';if(code==='42501')return 'ليس لديك صلاحية لتنفيذ هذه العملية (RLS).';if(code==='23514')return 'هناك قيمة غير صحيحة في البيانات المدخلة.';if(code==='23503')return 'العنصر مرتبط ببيانات أخرى أو الموظف غير موجود.';return e.message||String(e);}

function filterLeadRows(){let f=filters.leads||{};return data.leads.filter(l=>{
